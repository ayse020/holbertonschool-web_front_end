<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Interactive Font & Section Tagline Test</title>
    <link rel="stylesheet" href="styles/5-style.css">
    <link rel="stylesheet" href="styles/11-style.css">
    <style>
        body {
            padding: 20px;
            background-color: var(--color-light-grey);
            font-family: var(--font-family-base);
        }
        .test-box {
            margin: 15px 0;
            padding: 15px;
            border-radius: 6px;
            border: 2px solid var(--color-dark-grey);
            background-color: var(--color-white);
            transition: font-size 0.2s ease;
        }
        .title { font-family: var(--font-family-title); }
        label { display: block; margin-top: 10px; font-weight: bold; }

        /* Section tagline styling (11-style.css ilə eyni effekt üçün) */
        .section-tagline {
            font-family: var(--font-family-title);
            text-transform: var(--section-tagline-transform);
            font-weight: var(--font-weight-bold);
            font-size: 2rem; /* default ölçü */
        }
    </style>
</head>
<body>
    <h1 class="title" style="font-size: var(--font-size-xx-large);">Interactive Font & Color Test</h1>

    <!-- Section tagline testi -->
    <div class="test-box section-tagline">This is a section tagline</div>

    <!-- Small font test -->
    <div class="test-box" id="small-box">Small font (var(--font-size-small))</div>
    <label for="small-slider">Adjust Small Font:</label>
    <input type="range" id="small-slider" min="0.8" max="3" step="0.1" value="1.2">

    <!-- Medium font test -->
    <div class="test-box" id="medium-box">Medium font (var(--font-size-medium))</div>
    <label for="medium-slider">Adjust Medium Font:</label>
    <input type="range" id="medium-slider" min="0.8" max="3" step="0.1" value="1.6">

    <!-- Large font test -->
    <div class="test-box" id="large-box">Large font (var(--font-size-large))</div>
    <label for="large-slider">Adjust Large Font:</label>
    <input type="range" id="large-slider" min="0.8" max="3" step="0.1" value="1.8">

    <script>
        // Sliders üçün interaktiv dəyişmə
        const smallSlider = document.getElementById('small-slider');
        const smallBox = document.getElementById('small-box');

        const mediumSlider = document.getElementById('medium-slider');
        const mediumBox = document.getElementById('medium-box');

        const largeSlider = document.getElementById('large-slider');
        const largeBox = document.getElementById('large-box');

        smallSlider.addEventListener('input', () => {
            smallBox.style.fontSize = smallSlider.value + 'rem';
        });

        mediumSlider.addEventListener('input', () => {
            mediumBox.style.fontSize = mediumSlider.value + 'rem';
        });

        largeSlider.addEventListener('input', () => {
            largeBox.style.fontSize = largeSlider.value + 'rem';
        });
    </script>
</body>
</html>
